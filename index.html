<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Anvaya OS — Your AI Universe</title>
  <meta name="description" content="Anvaya is a personal AI operating system. Manage agents, memories, lineage, and realm energy." />
  <meta name="theme-color" content="#f7f7fc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="overlay" onclick="closeSidebar()"></div>

  <aside id="sidebar">
    <div class="brand">
      <div class="logo">✦</div>
      <div class="brand-text">
        <strong>ANVAYA OS</strong>
        <span>Your AI Universe</span>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="plan-card">
      <div class="plan-icon">♕</div>
      <strong>Premium Realm</strong>
      <p>Unlock more power and exclusive features.</p>
      <button class="btn-dark">Upgrade Plan</button>
    </div>
  </aside>

  <div id="main-wrap">
    <header>
      <button id="menu-btn" onclick="toggleSidebar()" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="search-bar">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
          <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10 10l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <input placeholder="Search agents, memories, or ask Orakai..." aria-label="Search" />
      </div>
      <div class="header-right">
        <button class="notif-btn" aria-label="Notifications">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M9 2a5 5 0 0 1 5 5v3l1.5 2.5H2.5L4 10V7a5 5 0 0 1 5-5z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 14.5a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span class="notif-dot"></span>
        </button>
        <div class="user-pill">
          <div class="avatar"></div>
          <span class="user-name">Seeker</span>
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
            <path d="M2 4l3.5 3.5L9 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </header>
    <main id="app"></main>
  </div>

  <nav id="bottomNav" aria-label="Mobile navigation"></nav>

  <script src="app.js"></script>
</body>
</html>
